<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 320" width="340" height="320" role="img">
  <title>Binary search tree example</title>
  <g stroke="#5F5E5A" stroke-width="1.5" fill="none">
    <line x1="170" y1="50" x2="98" y2="125"/>
    <line x1="170" y1="50" x2="242" y2="125"/>
    <line x1="98" y1="125" x2="62" y2="200"/>
    <line x1="242" y1="125" x2="206" y2="200"/>
    <line x1="242" y1="125" x2="278" y2="200"/>
    <line x1="62" y1="200" x2="98" y2="275"/>
  </g>
  <circle cx="170" cy="50" r="22" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="170" y="56" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#0C447C">4</text>
  <circle cx="98" cy="125" r="22" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="98" y="131" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#0C447C">3</text>
  <circle cx="242" cy="125" r="22" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="242" y="131" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#0C447C">6</text>
  <circle cx="62" cy="200" r="22" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="62" y="206" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#0C447C">1</text>
  <circle cx="206" cy="200" r="22" fill="#F3F3F3" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="206" y="206" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#2C2C2A">5</text>
  <circle cx="278" cy="200" r="22" fill="#F3F3F3" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="278" y="206" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#2C2C2A">7</text>
  <circle cx="98" cy="275" r="22" fill="#F3F3F3" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="98" y="281" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#2C2C2A">2</text>
</svg>
