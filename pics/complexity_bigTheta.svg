<svg xmlns="http://www.w3.org/2000/svg" width="700" height="560" viewBox="0 0 700 560" xmlns:c2pa="http://c2pa.org/manifest">

  <!-- x 軸箭頭 -->
  <defs>
    <marker id="axisArrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1A1A1A" />
    </marker>
  </defs>

  <!-- 座標軸 -->
  <line x1="70" y1="30" x2="70" y2="440" stroke="#1A1A1A" stroke-width="2" />
  <line x1="70" y1="440" x2="640" y2="440" stroke="#1A1A1A" stroke-width="2" marker-end="url(#axisArrow2)" />
  <text x="658" y="440" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1A1A1A">n</text>

  <!-- n0 虛線與標籤：f(n) 從這裡開始，永遠落在 c1*g(n) 與 c2*g(n) 之間 -->
  <line x1="297" y1="440" x2="297" y2="378" stroke="#9E9E9E" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="297" y="462" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1A1A1A">n<tspan baseline-shift="sub" font-size="13">0</tspan></text>

  <!-- c1*g(n)：淺藍色。控制點 = g(n) 的控制點，y 座標依 (基準線 - c1*(基準線-原始y)) 縮放而來 -->
  <path d="M70.0,434.0 C150.0,428.0 250.0,398.0 340.0,368.0 C430.0,338.0 540.0,305.0 620.0,268.4"
        fill="none" stroke="#7DD3FC" stroke-width="3.5" stroke-linecap="round" />
  <text x="630" y="268" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1A1A1A">c<tspan baseline-shift="sub" font-size="14">1</tspan> g(n)</text>

  <!-- c2*g(n)：另一種淺藍色。控制點跟 c1*g(n) 完全對應同一組 g(n)，只是縮放比例不同 -->
  <path d="M70.0,426.0 C150.0,412.0 250.0,342.0 340.0,272.0 C430.0,202.0 540.0,125.0 620.0,39.6"
        fill="none" stroke="#03AAFF" stroke-width="3.5" stroke-linecap="round" />
  <text x="630" y="40" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1A1A1A">c<tspan baseline-shift="sub" font-size="14">2</tspan> g(n)</text>

  <!-- f(n)：n0 之前自由震盪，峰、谷都是水平切線（平滑轉折）；
       n0 之後，先平順地頂到 c1*g(n)，再平順地頂到 c2*g(n)，其餘時間都夾在兩者之間 -->
  <path d="M70,415
           C120,190 160,145 190,145
           C220,145 225,438 255,438
           C275,438 295,385 310,355
           C318,335 329.4,371.3 381.7,354.3
           C398.8,348.7 428.9,205.1 483.75,161.6
           C497.9,150.4 560,240 618,215"
        fill="none" stroke="#4F46E5" stroke-width="3.5" stroke-linecap="round" />
  <text x="630" y="215" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1A1A1A">f(n)</text>

  <!-- 結論文字 -->
  <text x="355" y="510" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1A1A1A">f(n) = &#920;(g(n))</text>

</svg>
