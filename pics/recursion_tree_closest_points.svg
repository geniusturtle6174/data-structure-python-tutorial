<svg xmlns="http://www.w3.org/2000/svg" width="680" height="335" viewBox="0 0 680 335">

  <!-- 箭頭符號定義（樹狀連線與 Σ 連線共用） -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <!-- 樹狀連線（父節點 -> 子節點） -->
  <line x1="340" y1="90" x2="250" y2="150" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" />
  <line x1="340" y1="90" x2="430" y2="150" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" />
  <line x1="250" y1="190" x2="205" y2="250" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" />
  <line x1="250" y1="190" x2="295" y2="250" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" />
  <line x1="430" y1="190" x2="385" y2="250" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" />
  <line x1="430" y1="190" x2="475" y2="250" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" />

  <!-- 每層最右節點 -> 右側 Σ 標註（單向虛線，左右皆留空隙） -->
  <line x1="385" y1="70"  x2="550" y2="70"  stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <line x1="485" y1="170" x2="550" y2="170" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <line x1="520" y1="270" x2="550" y2="270" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)" />

  <!-- 第 0 層（root）：合併步驟花費 cn² -->
  <rect x="305" y="50" width="70" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1" />
  <text x="340" y="70" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0C447C">cn&#178;</text>

  <!-- 第 1 層：2 個節點，各花費 c(n/2)² -->
  <rect x="205" y="150" width="90" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1" />
  <text x="250" y="170" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0C447C">c(n/2)&#178;</text>

  <rect x="385" y="150" width="90" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1" />
  <text x="430" y="170" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0C447C">c(n/2)&#178;</text>

  <!-- 第 2 層：4 個節點，各花費 c(n/4)² -->
  <rect x="170" y="250" width="70" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1" />
  <text x="205" y="270" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0C447C">c(n/4)&#178;</text>

  <rect x="260" y="250" width="70" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1" />
  <text x="295" y="270" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0C447C">c(n/4)&#178;</text>

  <rect x="350" y="250" width="70" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1" />
  <text x="385" y="270" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0C447C">c(n/4)&#178;</text>

  <rect x="440" y="250" width="70" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1" />
  <text x="475" y="270" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#0C447C">c(n/4)&#178;</text>

  <!-- 遞迴持續的省略符號 -->
  <text x="205" y="315" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">⋮</text>
  <text x="295" y="315" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">⋮</text>
  <text x="385" y="315" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">⋮</text>
  <text x="475" y="315" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">⋮</text>

  <!-- 每層總和標註：注意此處總和隨深度遞減（cn², cn²/2, cn²/4, ...），由 root 主導 -->
  <text x="560" y="70"  dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Σ = cn&#178;</text>
  <text x="560" y="170" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Σ = cn&#178;/2</text>
  <text x="560" y="270" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Σ = cn&#178;/4</text>

</svg>
