<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250">
  <!-- 箭頭符號定義 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <!-- head 指標 -->
  <text x="17" y="110" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">head</text>
  <line x1="6" y1="125" x2="38" y2="125" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" />

  <!-- ptr 指標 -->
  <text x="280" y="58" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">ptr</text>
  <line x1="280" y1="66" x2="280" y2="98" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" />

  <!-- 節點 1：資料值 10 -->
  <rect x="40" y="100" width="80" height="50" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1" />
  <line x1="80" y1="100" x2="80" y2="150" stroke="#185FA5" stroke-width="0.5" />
  <text x="60" y="125" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0C447C">10</text>

  <!-- 節點 2：資料值 20 -->
  <rect x="150" y="100" width="80" height="50" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1" />
  <line x1="190" y1="100" x2="190" y2="150" stroke="#185FA5" stroke-width="0.5" />
  <text x="170" y="125" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0C447C">20</text>

  <!-- 節點 3：資料值 30 -->
  <rect x="260" y="100" width="80" height="50" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1" />
  <line x1="300" y1="100" x2="300" y2="150" stroke="#185FA5" stroke-width="0.5" />
  <text x="280" y="125" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0C447C">30</text>

  <!-- 新節點:資料值 35(插入用,位於節點 30 與節點 40 中間下方) -->
  <rect x="315" y="180" width="80" height="50" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1" />
  <line x1="355" y1="180" x2="355" y2="230" stroke="#185FA5" stroke-width="0.5" />
  <text x="335" y="205" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0C447C">35</text>

  <!-- 節點 35 的指標,指向節點 40 -->
  <circle cx="375" cy="205" r="3" fill="#5F5E5A" />
  <line x1="375" y1="205" x2="390" y2="150" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" />

  <!-- 節點 4：資料值 40 -->
  <rect x="370" y="100" width="80" height="50" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1" />
  <line x1="410" y1="100" x2="410" y2="150" stroke="#185FA5" stroke-width="0.5" />
  <text x="390" y="125" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0C447C">40</text>

  <!-- 節點 5：資料值 50 -->
  <rect x="480" y="100" width="80" height="50" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1" />
  <line x1="520" y1="100" x2="520" y2="150" stroke="#185FA5" stroke-width="0.5" />
  <text x="500" y="125" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0C447C">50</text>

  <!-- NULL：無框無底色 -->
  <text x="615" y="125" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#5F5E5A">NULL</text>

  <!-- 節點間的指標連線（起點為右格中央的圓點） -->
  <circle cx="100" cy="125" r="3" fill="#5F5E5A" />
  <line x1="100" y1="125" x2="150" y2="125" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" />

  <circle cx="210" cy="125" r="3" fill="#5F5E5A" />
  <line x1="210" y1="125" x2="260" y2="125" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" />

  <circle cx="320" cy="125" r="3" fill="#5F5E5A" />
  <line x1="320" y1="125" x2="335" y2="180" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" />

  <circle cx="430" cy="125" r="3" fill="#5F5E5A" />
  <line x1="430" y1="125" x2="480" y2="125" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" />

  <circle cx="540" cy="125" r="3" fill="#5F5E5A" />
  <line x1="540" y1="125" x2="590" y2="125" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" />

</svg>
