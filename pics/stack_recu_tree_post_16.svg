
<svg xmlns="http://www.w3.org/2000/svg" width="876" height="401" viewBox="0 0 876 401">

  <!-- 標題：算式本身 -->
  <text x="283.0" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#2C2C2A">2 3 + 4 5 *</text>

  <!-- 連線：父節點指向子節點，由上而下依序排列 -->
  <line x1="270.5" y1="100.0" x2="408.0" y2="135.0" stroke="#5F5E5A" stroke-width="1" />
  <line x1="408.0" y1="175.0" x2="483.0" y2="210.0" stroke="#5F5E5A" stroke-width="1" />

  <!-- 節點：方框＋文字成對出現，依樹狀走訪順序排列 -->
  <!-- 節點：-（運算子） -->
  <rect x="247.5" y="60.0" width="46" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1" />
  <text x="270.5" y="80.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#0C447C">-</text>
  <!-- 節點：/（運算子） -->
  <rect x="385.0" y="135.0" width="46" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1" />
  <text x="408.0" y="155.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#0C447C">/</text>
  <!-- 節點：6（運算元） -->
  <rect x="460.0" y="210.0" width="46" height="40" rx="8" fill="#FFF3D6" stroke="#C97A00" stroke-width="1" />
  <text x="483.0" y="230.0" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#2C2C2A">6</text>

  <!-- 步驟文字清單 -->
  <text id="log-line-1" x="616.0" y="30.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#9B9A94" stroke="#9B9A94" stroke-width="0.4">Output 2</text>
  <text id="log-line-2" x="616.0" y="57.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#9B9A94" stroke="#9B9A94" stroke-width="0.4">Push '+'</text>
  <text id="log-line-3" x="616.0" y="84.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#9B9A94" stroke="#9B9A94" stroke-width="0.4">Output 3</text>
  <text id="log-line-4" x="616.0" y="111.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#9B9A94" stroke="#9B9A94" stroke-width="0.4">Pop &amp; output '+'</text>
  <text id="log-line-5" x="616.0" y="138.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#9B9A94" stroke="#9B9A94" stroke-width="0.4">Push '-'</text>
  <text id="log-line-6" x="616.0" y="165.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#9B9A94" stroke="#9B9A94" stroke-width="0.4">Output 4</text>
  <text id="log-line-7" x="616.0" y="192.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#9B9A94" stroke="#9B9A94" stroke-width="0.4">Push '*'</text>
  <text id="log-line-8" x="616.0" y="219.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#9B9A94" stroke="#9B9A94" stroke-width="0.4">Output 5</text>
  <text id="log-line-9" x="616.0" y="246.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#9B9A94" stroke="#9B9A94" stroke-width="0.4">Pop &amp; output '*'</text>
  <text id="log-line-10" x="616.0" y="273.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#C97A00" stroke="#C97A00" stroke-width="0.5">Push '/'</text>
  <text id="log-line-11" x="616.0" y="300.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2C2C2A" stroke="#2C2C2A" stroke-width="0.4">Output 6</text>
  <text id="log-line-12" x="616.0" y="327.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2C2C2A" stroke="#2C2C2A" stroke-width="0.4">Pop &amp; output '/'</text>
  <text id="log-line-13" x="616.0" y="354.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2C2C2A" stroke="#2C2C2A" stroke-width="0.4">Pop &amp; output '-'</text>

</svg>
