<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230">
  <!-- 箭頭符號定義 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <!-- ===== 程式碼區塊（水平置中） ===== -->

  <!-- 目前這一行剛執行完，用淡藍底標示 -->
  <rect x="182" y="72" width="313" height="24" rx="4" fill="#F0F7FD" />

  <text x="190" y="12" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="15" dominant-baseline="central" fill="#2C2C2A">head = ListNode(10, None)</text>
  <text x="190" y="36" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="15" dominant-baseline="central" fill="#2C2C2A">ptr = head</text>
  <text x="190" y="60" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="15" dominant-baseline="central" fill="#2C2C2A">for v in (20, 30, <tspan fill="#C0392B" font-weight="700">40</tspan>, 50):</text>
  <text x="226" y="84" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="15" dominant-baseline="central" fill="#2C2C2A">ptr.next = ListNode(v, None)</text>
  <text x="226" y="108" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="15" dominant-baseline="central" fill="#2C2C2A">ptr = ptr.next</text>

  <!-- ===== 鏈結串列狀態圖 ===== -->

  <!-- head 指標 -->
  <text x="17" y="164" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">head</text>
  <line x1="6" y1="182" x2="38" y2="182" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" />

  <!-- ptr 指標 -->
  <text x="280" y="132" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">ptr</text>
  <line x1="280" y1="140" x2="280" y2="155" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" />

  <!-- 節點 1：資料值 10 -->
  <rect x="40" y="157" width="80" height="50" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1" />
  <line x1="80" y1="157" x2="80" y2="207" stroke="#185FA5" stroke-width="0.5" />
  <text x="60" y="182" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0C447C">10</text>

  <!-- 節點 2：資料值 20 -->
  <rect x="150" y="157" width="80" height="50" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1" />
  <line x1="190" y1="157" x2="190" y2="207" stroke="#185FA5" stroke-width="0.5" />
  <text x="170" y="182" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0C447C">20</text>

  <!-- 節點 3：資料值 30 -->
  <rect x="260" y="157" width="80" height="50" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1" />
  <line x1="300" y1="157" x2="300" y2="207" stroke="#185FA5" stroke-width="0.5" />
  <text x="280" y="182" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0C447C">30</text>

  <!-- 節點 4：資料值 40 -->
  <rect x="370" y="157" width="80" height="50" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1" />
  <line x1="410" y1="157" x2="410" y2="207" stroke="#185FA5" stroke-width="0.5" />
  <text x="390" y="182" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0C447C">40</text>

  <!-- NULL：無框無底色 -->
  <text x="500" y="182" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#5F5E5A">NULL</text>

  <!-- 節點間的指標連線（起點為右格中央的圓點） -->
  <circle cx="100" cy="182" r="3" fill="#5F5E5A" />
  <line x1="100" y1="182" x2="150" y2="182" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" />

  <circle cx="210" cy="182" r="3" fill="#5F5E5A" />
  <line x1="210" y1="182" x2="260" y2="182" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" />

  <circle cx="320" cy="182" r="3" fill="#5F5E5A" />
  <line x1="320" y1="182" x2="370" y2="182" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" />

  <circle cx="430" cy="182" r="3" fill="#5F5E5A" />
  <line x1="430" y1="182" x2="480" y2="182" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)" />

</svg>
