
<svg xmlns="http://www.w3.org/2000/svg" width="566" height="345" viewBox="0 0 566 345">

  <!-- 標題：算式本身 -->
  <text x="283.0" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#2C2C2A">2 3 + 4 5 * 6 /</text>

  <!-- 節點：方框＋文字成對出現，依樹狀走訪順序排列 -->
